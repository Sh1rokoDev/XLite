org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# WiX is downloaded only by the Windows installer packaging script.
compose.desktop.application.downloadWix=false

# Increase this for every release. Windows MSI upgrades compare all three fields.
xliteVersion=0.1.2
xliteAndroidVersionCode=3
